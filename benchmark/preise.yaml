# Preisblatt F8-Konkurrenz-Benchmark (KB-1-Geruest, vorbefuellt 2026-09-09)
#
# Regeln aus dem Design (.pa/report_benchmark_design_2026-09-09.md §4):
# 1. Preise werden am Tag vor Lauf 1 von den OFFIZIELLEN Preisseiten erneut
#    abgezogen (KB-2: "Preisblatt befuellen"). Diese Vorbefuellung stammt von
#    den offiziellen Seiten, Abruf 2026-09-09 — KB-2 verifiziert/friert ein.
# 2. Abo-Flatrates: doppelt gefuehrt — (a) Grenzkosten 0 $ + Vermerk,
#    (b) Referenzkosten nach API-Listenpreis. Nie mischen.
# 3. Free-Tier (OmniRoute): 0 $ + ToS-Vermerk, Tokenzahlen bleiben sichtbar.
# 4. Dieselbe Tabelle gilt fuer beide Seiten.
# 5. Kosten je gemergter Task = alle Tokens im Task-Lebensfenster x Preis;
#    verworfene Tasks separat als "Kosten je verworfenem Ergebnis".
#
# usd_per_m_cached = Preis je Mio Cache-Read-Tokens (Cache-Hit), nicht Write.

preise:
