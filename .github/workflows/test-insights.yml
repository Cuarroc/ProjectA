# Test Insights upload (CI-SEC-01): the JUnit reports of a finished `ci` run
# go to Mergify from HERE, not from the PR jobs of ci.yml. Those jobs execute
# PR code, so no secret may be reachable there (gate scripts/ci/pr-secrets.sh).
#
# `workflow_run` always runs the workflow file from the default branch, with
# access to secrets, and starts only after `ci` has completed. This job checks
# out only the default branch's picker script and executes nothing from the
# run: it downloads the artifacts
# `junit-linux` / `junit-windows_1` / `junit-windows_2` (untrusted XML, treated as data only) and
# hands the files to the uploader. Without the secret MERGIFY_TOKEN the upload
# steps are skipped (env flag, never the secret itself) and the job stays
# green; this workflow is never a merge gate.
#
# Open (CI-SEC-01 review K2): gha-mergify-ci has no head-sha/branch input for
# `junit-process` (only `job_name`); which commit Mergify attributes in the
# `workflow_run` context is observable only after the merge.
name: test-insights

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# No default rights; the single job asks for what it needs.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  upload:
    name: Test Insights upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    env:
      # Only "true"/"false", so no step besides the uploaders sees the token.
      MERGIFY_UPLOAD: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps:
      # `workflow_run` checks out the DEFAULT branch, never the PR head: only
      # the trusted picker script is needed, no history, no credentials.
      - name: Check out the picker script
        if: env.MERGIFY_UPLOAD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Download JUnit artifacts of the ci run
        if: env.MERGIFY_UPLOAD == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The picker is a script of the default branch (see the checkout above),
      # so it has a selftest: scripts/test-test-insights-pick.sh.
      - name: Collect reports
        if: env.MERGIFY_UPLOAD == 'true'
        run: bash scripts/ci/test-insights-pick.sh artifacts reports

      - name: Test Insights - linux nextest
        if: ${{ env.MERGIFY_UPLOAD == 'true' && hashFiles('reports/linux-nextest.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: gates (linux)
          report_path: reports/linux-nextest.xml

      - name: Test Insights - linux vitest
        if: ${{ env.MERGIFY_UPLOAD == 'true' && hashFiles('reports/linux-vitest.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: gates (linux)
          report_path: reports/linux-vitest.xml

      - name: Test Insights - windows nextest 1/2
        if: ${{ env.MERGIFY_UPLOAD == 'true' && hashFiles('reports/windows-1-nextest.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: windows tests (windows_1)
          report_path: reports/windows-1-nextest.xml

      - name: Test Insights - windows nextest 2/2
        if: ${{ env.MERGIFY_UPLOAD == 'true' && hashFiles('reports/windows-2-nextest.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: windows tests (windows_2)
          report_path: reports/windows-2-nextest.xml
