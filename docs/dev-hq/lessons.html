<!--
THESIS: operator desk for cited development truth. Every claim carries its
        source; nothing here may be believable without a path under it.
OWN-WORLD: a world this project could not lend to another product. If a screen
        would work unchanged for someone else's dashboard, it is wrong here.
STORY: what is serial right now, what is blocked and by whom, what a human must
        decide — in that order, before anything decorative.
FIRST VIEWPORT: the state of the release and the one grip that follows from it,
        above the fold at 1280×800 and unbroken at 1024×768.
FORM: form follows the evidence standard. Any container, motion or ornament must
        answer "what does this make readable that was not readable before?" —
        an unanswered element is removed, not restyled.
REFUSES: product chrome that duplicates F2 goals or Variant B; decoration that
        outranks a lock, a blocker or an open question; motion on numbers, times
        and log lines; state that cannot distinguish not-yet-asked from empty
        from failed.
FINISH: unreviewed and undocumented is unfinished. This build ends with the
        finish review, the dual-review disposition, looked-at screenshots, and
        DESIGN.md derived from the artifact.
-->
