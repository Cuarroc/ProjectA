      L("dim", "w16-11 parked: Codex week limit, resumes 11.10. 14:31"),
      L("agent", "Next in queue: w16-15 status-bar tokens (Kimi K3)"),
    ],
  };
  const status = {
    quota: [
      { name: "Claude", used: 72, note: "Woche 72 %" },
      { name: "Codex", used: 100, note: "leer bis 11.10." },
      { name: "Kimi", used: 34, note: "Woche 34 %" },
      { name: "GLM", used: 18, note: "Woche 18 %" },
    ],
    ramFree: "6,2", ramTotal: "16", queue: 4, builds: "2/3", omni: true,
  };

  const app = {
    STATE, workers, orchestrator, status,
    tabs: ["orch", "w16-05", "w16-02", "w16-07"],
    tab: "w16-05",
    sel: "w16-05",
    drafts: {},
    byId(id) { return id === "orch" ? orchestrator : workers.find((w) => w.id === id); },
    current() { return app.byId(app.tab); },
    attention() { return workers.filter((w) => w.state === "needs").length; },
    count(s) { return workers.filter((w) => w.state === s).length; },
    esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    },
    termHTML(w) {
      const pre = { cmd: "›", agent: "●", you: "Du", ok: "", out: "", dim: "", err: "", warn: "" };
      return w.lines.map(([k, t]) =>
        `<div class="ln ln-${k}">${pre[k] ? `<span class="ln-pre" aria-hidden="true">${pre[k]}</span>` : ""}<span class="ln-t">${app.esc(t)}</span></div>`
      ).join("") + (w.live ? `<div class="ln ln-cursor"><span class="ln-pre" aria-hidden="true">›</span><span class="cursor" aria-hidden="true"></span></div>` : "");
    },
    // State glyphs: shape carries the state as well as colour (dot, diamond, cross, bars, ring).
    glyph(state, size) {
      const z = size || 12, a = `width="${z}" height="${z}" viewBox="0 0 12 12" aria-hidden="true" class="g g-${state}"`;
      if (state === "working") return `<svg ${a}><circle cx="6" cy="6" r="4" fill="currentColor"/></svg>`;
      if (state === "needs") return `<svg ${a}><path d="M6 1.2 10.8 6 6 10.8 1.2 6Z" fill="currentColor"/></svg>`;
      if (state === "error") return `<svg ${a}><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
      if (state === "merge") return `<svg ${a}><path d="M1.8 6.3 4.7 9.2 10.2 3.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      if (state === "review") return `<svg ${a}><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 2a4 4 0 0 1 0 8Z" fill="currentColor"/></svg>`;
      if (state === "paused") return `<svg ${a}><rect x="2.5" y="2" width="2.6" height="8" rx=".8" fill="currentColor"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8" fill="currentColor"/></svg>`;
      return `<svg ${a}><circle cx="6" cy="6" r="3.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    },
    select(id) {
      app.sel = id;
      if (!app.tabs.includes(id)) app.tabs.push(id);
      app.tab = id;
      app.render();
    },
    selectTab(id) { app.tab = id; app.sel = id; app.render(); },
    closeTab(id) {
      if (id === "orch") return;
      const i = app.tabs.indexOf(id);
      app.tabs.splice(i, 1);
      if (app.tab === id) { app.tab = app.tabs[Math.max(0, i - 1)]; app.sel = app.tab; }
      app.render();
    },
    answer(id, text) {
      const w = app.byId(id);
      if (!w || !w.q || !text.trim()) return;
      w.lines.push(L("you", text.trim()));
      w.lines.push(L("agent", "Understood. Continuing with: " + text.trim()));
      w.q = null; w.state = "working"; w.live = true; w.since = "gerade eben"; w.detail = "Arbeitet mit deiner Antwort weiter";
      delete app.drafts[id];
      app.announce(`Antwort an ${id} gesendet. ${w.title} arbeitet weiter.`);
      app.render();
    },
    announce(msg) { const el = document.getElementById("live"); if (el) el.textContent = msg; },
    render() {
      const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
      window.view.render(app);
      document.querySelectorAll("[data-scroll-end]").forEach((el) => { el.scrollTop = el.scrollHeight; });
      if (key) { const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (el) el.focus({ preventScroll: true }); }
    },
  };
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-select],[data-tab],[data-close],[data-choice],[data-theme-toggle]");
    if (!t) return;
    if (t.dataset.close) { e.stopPropagation(); app.closeTab(t.dataset.close); return; }
    if (t.dataset.select) app.select(t.dataset.select);
    else if (t.dataset.tab) app.selectTab(t.dataset.tab);
    else if (t.dataset.choice) app.answer(t.dataset.for, t.dataset.choice);
    else if (t.dataset.themeToggle !== undefined) {
      const r = document.documentElement;
      r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
      app.render();
    }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-answer]");
    if (!f) return;
    e.preventDefault();
    const input = f.querySelector("textarea,input");
    app.answer(f.dataset.answer, input.value);
  });
  document.addEventListener("input", (e) => {
    const f = e.target.closest("[data-answer]");
    if (f) app.drafts[f.dataset.answer] = e.target.value;
  });
  // Tablist keyboard: arrows, Home, End move and activate (WAI-ARIA tabs, automatic activation).
  document.addEventListener("keydown", (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    const list = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
    let i = list.indexOf(tab);
    if (e.key === "ArrowRight") i = (i + 1) % list.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + list.length) % list.length;
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = list.length - 1;
    else return;
    e.preventDefault();
    app.selectTab(list[i].dataset.tab);
  });
  // A url hash like #sel=w16-07 preselects a worker (used for the proof screenshots).
  const m = location.hash.match(/sel=([\w-]+)/);
  if (m && app.byId(m[1])) { app.sel = m[1]; if (!app.tabs.includes(m[1])) app.tabs.push(m[1]); app.tab = m[1]; }
  window.app = app;
  document.addEventListener("DOMContentLoaded", () => app.render());
})();
</script>
<script>
(function () {
  // A stable pseudo-random output trace per worker (lines per 20 s, last 10 min).
  function trace(w) {
    let h = 0; for (const c of w.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) % 1000) / 1000;
    const out = [];
    for (let i = 0; i < 30; i++) out.push(2 + Math.round(rnd() * 7));
    const quiet = { needs: 6, paused: 24, idle: 14, error: 4, working: 0, merge: 9, review: 12 }[w.state] || 0;
    for (let i = 30 - quiet; i < 30; i++) out[i] = 0;
    if (w.state === "error") out[25] = 10;
    return out;
  }
  window.view = {
    render(app) {
      const e = app.esc, w = app.current();
      const sig = (x) => {
        const t = trace(x);
        return `<button class="sig ${x.state}${x.id === "orch" ? " orch" : ""}" data-select="${x.id}" data-key="sig-${x.id}" aria-current="${x.id === app.sel}" aria-label="${e(x.id === "orch" ? "Orchestrator" : x.id + " " + x.title)}, ${app.STATE[x.state]}">
          <span class="top"><span class="lamp">${app.glyph(x.state, 10)}</span><span class="id">${x.id === "orch" ? "ORCH" : x.id.toUpperCase()}</span><span class="el">${e(x.since.replace("seit ", ""))}</span></span>
          <span class="title">${e(x.title)}</span>
          <span class="trace" aria-hidden="true">${t.map((v, i) => `<i class="${v ? (i >= 26 ? "now" : "lit") : ""}" style="height:${Math.max(2, v * 2)}px"></i>`).join("")}</span>
          <span class="foot"><b>${app.STATE[x.state]}</b><span>${e(x.agent.replace("Claude ", ""))}</span></span>
        </button>`;
      };
      const tab = (id) => { const t = app.byId(id); return `<div class="tw ${t.state}"><button class="tab" role="tab" id="tab-${id}" data-tab="${id}" data-key="tab-${id}" aria-selected="${id === app.tab}" aria-controls="panel" tabindex="${id === app.tab ? 0 : -1}">${app.glyph(t.state, 10).replace('class="g', 'style="color:var(--lamp)" class="g')}<span class="id">${id === "orch" ? "ORCH" : id.toUpperCase()}</span><span>${e(id === "orch" ? "Orchestrator" : t.title)}</span></button>${id === "orch" ? "" : `<button class="x" aria-label="Tab ${id} schließen" data-close="${id}" tabindex="-1">×</button>`}</div>`; };
      const segs = (pct, n) => `<span class="segs" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${i < Math.round(pct / 100 * n) ? "on" : ""}"></i>`).join("")}</span>`;
      const gauge = (q, opt) => `<div class="gauge ${q.used >= 100 ? "out" : q.used >= 70 ? "hot" : ""} ${opt ? "opt" : ""}"><span class="lab"><span>${q.name}</span><span class="val">${q.used >= 100 ? "leer" : q.used + " %"}</span></span>${segs(q.used, 10)}</div>`;
      const att = app.attention();
      const firstNeed = app.workers.find((x) => x.state === "needs");
      const desk = w.q ? `<section class="ask" aria-label="Anfrage von ${w.id}">
          <div class="hd">${app.glyph("needs", 12)} Anfrage von ${w.id.toUpperCase()} · ${e(w.since)}</div>
          <p>${e(w.q.text)}</p>
          <div class="opts">${w.q.options.map((o, i) => `<button class="btn ${i === 0 ? "go" : ""}" data-choice="${e(o)}" data-for="${w.id}" data-key="opt-${i}">${e(o)}</button>`).join("")}</div>
          <form data-answer="${w.id}"><label class="sr-only" for="ans">Eigene Antwort</label><textarea id="ans" data-key="ans" placeholder="Eigene Antwort …">${e(app.drafts[w.id] || "")}</textarea><button class="btn send" type="submit" data-key="send">Antwort senden</button></form>
        </section>` : "";
      document.getElementById("root").innerHTML = `
<div class="win">
  <nav class="rail" aria-label="Projekte">
    <button class="logo" aria-label="ProjectA">A</button>
    <button aria-current="true" aria-label="Projekt ProjectA" data-key="p1">PA</button>
    <button aria-label="Projekt Dev HQ" data-key="p2">HQ</button>
    <button aria-label="Projekt hinzufügen" data-key="p3">+</button>
    <span class="sp"></span>
    <button aria-label="Neuer Worker" data-key="new" style="font-size:20px">＋</button>
  </nav>
  <section class="fleet" aria-label="Flotte: ${app.workers.length} Worker">${sig(app.orchestrator)}${app.workers.map(sig).join("")}</section>
  <main class="work ${w.state}">
    <div class="tabs" role="tablist" aria-label="Sitzungen">${app.tabs.map(tab).join("")}</div>
    <div class="term" id="panel" role="tabpanel" aria-labelledby="tab-${w.id}" tabindex="0" data-scroll-end>${app.termHTML(w)}</div>
    <aside class="desk" aria-label="Pult">
      ${desk}
      <h2>Zugdaten</h2>
      <div class="big">${e(w.title)}</div>
      <dl class="data">
        <dt>Zustand</dt><dd style="color:var(--lamp)">${app.STATE[w.state]}</dd>
        <dt>Agent</dt><dd>${e(w.agent)}</dd>
        ${w.id === "orch" ? `<dt>Warteschlange</dt><dd>${app.status.queue}</dd>` : `<dt>Laufzeit</dt><dd>${e(w.elapsed)}</dd><dt>Diff</dt><dd>${e(w.diff)}</dd><dt>Tests</dt><dd>${e(w.tests)}</dd><dt>Tokens</dt><dd>${e(w.tokens)}</dd>`}
        <dt>Zweig</dt><dd class="mono">${e(w.branch)}</dd>
      </dl>
    </aside>
  </main>
  <footer class="inst" aria-label="Instrumente">
    <button class="att ${att ? "" : "none"}" data-select="${firstNeed ? firstNeed.id : "orch"}" data-key="att"><span class="n">${att}</span>${att === 1 ? "Anfrage offen" : "Anfragen offen"}</button>
    <div class="gauge"><span class="lab"><span>Flotte</span><span class="val">${app.count("working")} laufen</span></span>${segs(app.count("working") / app.workers.length * 100, 7)}</div>
    ${app.status.quota.map((q, i) => gauge(q, i > 1)).join("")}
    <span class="sp"></span>
    <div class="gauge"><span class="lab"><span>RAM frei</span><span class="val">${app.status.ramFree} / ${app.status.ramTotal} GB</span></span>${segs(6.2 / 16 * 100, 16)}</div>
    <div class="gauge"><span class="lab"><span>cargo</span><span class="val">${app.status.builds}</span></span><span class="slots" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></span></div>
    <div class="gauge"><span class="lab"><span>Warteschlange</span><span class="val">${app.status.queue}</span></span>${segs(app.status.queue / 8 * 100, 8)}</div>
  </footer>
</div>`;
    },
  };
})();
</script>
</body>
</html>
