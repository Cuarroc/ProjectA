*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--ink); color-scheme: dark;
  font: 400 14px/21px Recursive, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:root { --ease-out: cubic-bezier(.23,1,.32,1); --voice: "Sitka Subheading", "Sitka Text", Sitka, Georgia, serif; --mono: "Cascadia Mono", Consolas, monospace; }

.win { height: 100vh; display: grid; grid-template-columns: 340px minmax(0,1fr); grid-template-rows: minmax(0,1fr) 30px; }

.inbox { background: var(--inbox); border-right: 1px solid var(--hair); overflow-y: auto; display: flex; flex-direction: column; }
.ihead { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px 10px; }
.ihead h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.ihead span { color: var(--fog); font-size: 13px; }
.ihead .new { margin-left: auto; white-space: nowrap; }
.sect { padding: 14px 20px 6px; color: var(--fog); font-size: 12.5px; font-weight: 600; }
.ask { margin: 0 12px 10px; padding: 14px 14px 12px; border-radius: 10px; background: var(--amber-wash); border: 1px solid transparent; display: grid; gap: 8px; transition: border-color 140ms var(--ease-out); }
.ask[data-current="true"] { border-color: var(--amber); }
.ask .open { all: unset; cursor: pointer; display: grid; gap: 6px; border-radius: 4px; }
.ask .open:focus-visible { outline: 2px solid var(--steel); outline-offset: 4px; }
.ask .who { font-size: 12.5px; color: var(--fog); display: flex; gap: 6px; align-items: center; white-space: nowrap; min-width: 0; }
.ask .who b { color: var(--amber); font-weight: 650; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ask q { font-family: var(--voice); font-style: italic; font-size: 16px; line-height: 23px; quotes: "„" "“"; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ask .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { min-height: 30px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--edge); background: transparent; color: var(--ink); font-weight: 600; font-size: 13px; transition: background-color 140ms var(--ease-out), transform 100ms var(--ease-out); }
.btn:hover { background: var(--raised); }
.btn:active { transform: scale(.97); }
.btn.go { background: var(--amber); border-color: var(--amber); color: var(--on-accent); }
.btn.go:hover { background: #ecc98a; }
.btn.primary { background: var(--mint); border-color: var(--mint); color: var(--on-accent); }
.btn.primary:hover { background: #95dec1; }
.item { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 0 10px; align-items: baseline; margin: 0 12px; padding: 9px 8px; border-radius: 8px; transition: background-color 140ms var(--ease-out); }
.item:hover { background: var(--raised); }
.item[aria-current="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--ink); }
.item:focus-visible { outline: 2px solid var(--steel); outline-offset: 1px; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.item .s { color: var(--fog); font-size: 12.5px; white-space: nowrap; }
.item .d { grid-column: 2 / 4; color: var(--fog); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.error .d { color: var(--ember); }
.g-working { color: var(--steel); } .g-merge { color: var(--mint); } .g-review { color: var(--violet); } .g-needs { color: var(--amber); } .g-error { color: var(--ember); } .g-paused, .g-idle { color: var(--fog); }

/* record */
.rec { min-width: 0; display: grid; grid-template-rows: 48px minmax(0,1fr); min-height: 0; background: var(--page); }
.reg { min-width: 0; display: flex; align-items: stretch; gap: 22px; padding: 0 28px; border-bottom: 1px solid var(--hair); }
.tabs { display: flex; gap: 20px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tw { position: relative; display: flex; align-items: center; }
.tab { height: 100%; display: flex; align-items: center; gap: 7px; padding: 0 22px 0 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--fog); white-space: nowrap; max-width: 240px; }
.tab span { overflow: hidden; text-overflow: ellipsis; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tw.orch .tab { padding-right: 0; }
.x { position: absolute; right: -2px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--fog); opacity: 0; }
.tw:hover .x, .x:focus-visible, .tab[aria-selected="true"] + .x { opacity: 1; }
.x:hover { background: var(--raised); color: var(--ink); }
.mode { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.mode button { height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--fog); font-size: 13px; }
.mode button:hover { color: var(--ink); }
.mode button[aria-pressed="true"] { border-color: var(--edge); color: var(--ink); }
.scroll { position: relative; overflow-y: auto; }
.doc { max-width: 860px; padding: 24px 40px 40px 28px; }
.doc h2 { margin: 0 0 4px 64px; font-size: 27px; line-height: 33px; font-weight: 700; letter-spacing: -.025em; }
.byline { margin: 0 0 26px 64px; color: var(--fog); font-size: 13px; }
.byline b { font-weight: 600; }
.e { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 12px; margin-bottom: 12px; }
.e time { color: var(--fog); font-size: 12px; padding-top: 3px; text-align: right; }
.e p { margin: 0; font-size: 14.5px; line-height: 23px; max-width: 68ch; }
.e.warn p { color: var(--amber); font-style: italic; }
.step { border-radius: 8px; background: var(--ground); padding: 10px 14px; font: 12px/18px var(--mono); overflow-x: auto; }
.step .c { color: var(--steel); white-space: pre-wrap; overflow-wrap: anywhere; }
.step .c::before { content: "› "; color: var(--fog); }
.step .o { color: var(--fog); white-space: pre-wrap; overflow-wrap: anywhere; }
.step .o.ok { color: var(--mint); } .step .o.err { color: var(--ember); }
.step.failed { background: var(--ember-wash); }
.e.you p { font-weight: 600; } .e.you time { color: var(--amber); }
.e.live p { color: var(--fog); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--steel); margin-right: 8px; }

.question { margin: 22px 0 0 64px; padding: 18px 0 0; border-top: 1px solid var(--hair); }
.question .who { color: var(--amber); font-size: 13px; font-weight: 650; display: flex; gap: 8px; align-items: center; }
.question blockquote { margin: 8px 0 16px; font-family: var(--voice); font-style: italic; font-size: 22px; line-height: 31px; max-width: 34em; }
.question .opts { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.question form { display: grid; gap: 8px; max-width: 640px; }
.question label { color: var(--fog); font-size: 12.5px; }
.question textarea { resize: vertical; min-height: 64px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--ground); color: var(--ink); font-size: 14px; line-height: 21px; }
.question textarea::placeholder { color: var(--fog); }
.question .send { justify-self: start; }

.raw { padding: 18px 28px; font: 12.5px/19px var(--mono); background: var(--ground); min-height: 100%; }
.ln { display: flex; gap: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln-pre { flex: none; width: 14px; color: var(--fog); }
.ln-ok, .ln-out, .ln-dim, .ln-err, .ln-warn { padding-left: 24px; }
.ln-cmd .ln-t, .ln-cmd .ln-pre { color: var(--steel); } .ln-ok .ln-t { color: var(--mint); } .ln-err .ln-t { color: var(--ember); } .ln-warn .ln-t { color: var(--amber); } .ln-dim .ln-t { color: var(--fog); }
.ln-agent .ln-pre { color: var(--mint); } .ln-you .ln-pre { width: auto; color: var(--amber); }
.cursor { display: inline-block; width: 8px; height: 15px; margin-top: 2px; background: var(--ink); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.status { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: var(--inbox); border-top: 1px solid var(--hair); color: var(--fog); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.status b { color: var(--ink); font-weight: 600; } .status .out, .status .out b { color: var(--ember); }
.status .sp { flex: 1; }

@media (max-width: 1180px) { .win { grid-template-columns: 300px minmax(0,1fr); } .ihead > span { display: none; } .doc { padding: 24px 24px 40px 16px; } .status .opt { display: none; } }
@media (max-width: 760px) { .win { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr) 30px; } .inbox { max-height: 40vh; } .doc h2, .byline, .question { margin-left: 0; } .e { grid-template-columns: 1fr; } .e time { text-align: left; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

    announce(msg) { const el = document.getElementById("live"); if (el) el.textContent = msg; },
    render() {
      const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
      window.view.render(app);
      document.querySelectorAll("[data-scroll-end]").forEach((el) => { el.scrollTop = el.scrollHeight; });
      if (key) { const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (el) el.focus({ preventScroll: true }); }
    },
  };
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-select],[data-tab],[data-close],[data-choice],[data-theme-toggle]");
    if (!t) return;
    if (t.dataset.close) { e.stopPropagation(); app.closeTab(t.dataset.close); return; }
    if (t.dataset.select) app.select(t.dataset.select);
    else if (t.dataset.tab) app.selectTab(t.dataset.tab);
    else if (t.dataset.choice) app.answer(t.dataset.for, t.dataset.choice);
    else if (t.dataset.themeToggle !== undefined) {
      const r = document.documentElement;
      r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
      app.render();
    }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-answer]");
    if (!f) return;
    e.preventDefault();
    const input = f.querySelector("textarea,input");
    app.answer(f.dataset.answer, input.value);
  });
  document.addEventListener("input", (e) => {
    const f = e.target.closest("[data-answer]");
    if (f) app.drafts[f.dataset.answer] = e.target.value;
  });
  // Tablist keyboard: arrows, Home, End move and activate (WAI-ARIA tabs, automatic activation).
  document.addEventListener("keydown", (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    const list = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
    let i = list.indexOf(tab);
    if (e.key === "ArrowRight") i = (i + 1) % list.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + list.length) % list.length;
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = list.length - 1;
    else return;
    e.preventDefault();
    app.selectTab(list[i].dataset.tab);
  });
  // A url hash like #sel=w16-07 preselects a worker (used for the proof screenshots).
  const m = location.hash.match(/sel=([\w-]+)/);
  if (m && app.byId(m[1])) { app.sel = m[1]; if (!app.tabs.includes(m[1])) app.tabs.push(m[1]); app.tab = m[1]; }
  window.app = app;
  document.addEventListener("DOMContentLoaded", () => app.render());
})();
</script>
<script>
(function () {
  let raw = false;
  // Turn the raw terminal lines into a record: commands with their output become one step,
  // agent narration becomes prose, your replies are marked as yours.
  function record(w) {
    const out = []; let cur = null;
    for (const [k, t] of w.lines) {
      if (k === "cmd") { cur = { kind: "step", cmd: t, out: [] }; out.push(cur); continue; }
      if ((k === "out" || k === "ok" || k === "dim" || k === "err") && cur) { cur.out.push([k, t]); if (k === "err") cur.failed = true; continue; }
      if (k === "out" || k === "ok" || k === "dim" || k === "err") { cur = { kind: "step", cmd: null, out: [[k, t]] }; out.push(cur); continue; }
      cur = null;
      out.push({ kind: k, text: t.replace(/^[?!] /, "") });
    }
    return out;
  }
  const start = { "w16-03": [13, 30], "w16-05": [13, 22], "w16-02": [13, 36], "w16-07": [13, 10], "w16-12": [14, 5], "w16-14": [13, 53], "w16-11": [11, 4], "w16-09": [13, 7], orch: [13, 40] };
  const clock = (id, i) => { const [h, m] = start[id] || [13, 0]; const t = h * 60 + m + i * 3; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
  document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-mode]"); if (b) { raw = b.dataset.mode === "raw"; window.app.render(); } });
  window.view = {
    render(app) {
      const e = app.esc, w = app.current(), W = app.workers;
      const ask = (x) => `<article class="ask" data-current="${x.id === app.sel}" aria-label="Frage von ${e(x.title)}">
          <button class="open" data-select="${x.id}" data-key="ask-${x.id}"><span class="who">${app.glyph("needs", 10)}<b>${e(x.title)}</b> · ${e(x.since)}</span><q>${e(x.q.text)}</q></button>
          <div class="opts">${x.q.options.map((o, i) => `<button class="btn ${i === 0 ? "go" : ""}" data-choice="${e(o)}" data-for="${x.id}" data-key="iopt-${x.id}-${i}">${e(o)}</button>`).join("")}</div>
        </article>`;
      const item = (x) => `<button class="item ${x.state}" data-select="${x.id}" data-key="item-${x.id}" aria-current="${x.id === app.sel}">${app.glyph(x.state, 11)}<span class="t">${e(x.title)}</span><span class="s">${e(x.since.replace("seit ", ""))}</span><span class="d">${app.STATE[x.state]} · ${e(x.detail)}</span></button>`;
      const needs = W.filter((x) => x.state === "needs"), errs = W.filter((x) => x.state === "error"), run = W.filter((x) => x.state === "working"), rest = W.filter((x) => x.state === "paused" || x.state === "idle"), done = W.filter((x) => x.state === "merge" || x.state === "review");
      const tab = (id) => { const t = app.byId(id); return `<div class="tw ${id === "orch" ? "orch" : ""}"><button class="tab" role="tab" id="tab-${id}" data-tab="${id}" data-key="tab-${id}" aria-selected="${id === app.tab}" aria-controls="panel" tabindex="${id === app.tab ? 0 : -1}">${app.glyph(t.state, 10)}<span>${e(id === "orch" ? "Orchestrator" : t.title)}</span></button>${id === "orch" ? "" : `<button class="x" aria-label="Tab ${e(t.title)} schließen" data-close="${id}" tabindex="-1">×</button>`}</div>`; };
      const entries = record(w).map((r, i) => {
        const time = `<time>${clock(w.id, i)}</time>`;
        if (r.kind === "step") return `<div class="e">${time}<div class="step ${r.failed ? "failed" : ""}">${r.cmd ? `<div class="c">${e(r.cmd)}</div>` : ""}${r.out.map(([k, t]) => `<div class="o ${k === "ok" ? "ok" : k === "err" ? "err" : ""}">${e(t)}</div>`).join("")}</div></div>`;
        if (r.kind === "you") return `<div class="e you">${time}<p>Du: ${e(r.text)}</p></div>`;
        return `<div class="e ${r.kind}">${time}<p>${e(r.text)}</p></div>`;
      }).join("") + (w.live && !w.q ? `<div class="e live"><time>jetzt</time><p><span class="dot" aria-hidden="true"></span>${e(w.detail)} …</p></div>` : "");
      const firstNeed = needs[0];
      document.getElementById("root").innerHTML = `
<div class="win">
  <nav class="inbox" aria-label="Eingang">
    <div class="ihead"><h1>Eingang</h1><span>ProjectA</span><button class="btn primary new" data-key="new">Neuer Worker</button></div>
    ${needs.length ? `<div class="sect">Wartet auf dich · ${needs.length}</div>${needs.map(ask).join("")}` : `<div class="sect">Niemand wartet auf dich.</div>`}
    ${errs.length ? `<div class="sect">Fehler · ${errs.length}</div>${errs.map(item).join("")}` : ""}
    <div class="sect">Läuft · ${run.length + 1}</div>${item(app.orchestrator)}${run.map(item).join("")}
    ${done.length ? `<div class="sect">Bereit zum Mergen · ${done.length}</div>${done.map(item).join("")}` : ""}
    <div class="sect">Ruht · ${rest.length}</div>${rest.map(item).join("")}
  </nav>
  <main class="rec">
    <div class="reg">
      <div class="tabs" role="tablist" aria-label="Sitzungen">${app.tabs.map(tab).join("")}</div>
      <div class="mode" role="group" aria-label="Ansicht"><button data-mode="doc" aria-pressed="${!raw}" data-key="m-doc">Protokoll</button><button data-mode="raw" aria-pressed="${raw}" data-key="m-raw">Terminal</button></div>
    </div>
    <div class="scroll" id="panel" role="tabpanel" aria-labelledby="tab-${w.id}" tabindex="0" ${w.q ? "" : "data-scroll-end"}>
      ${raw ? `<div class="raw">${app.termHTML(w)}</div>` : `<article class="doc">
        <h2>${e(w.title)}</h2>
        <p class="byline"><b>${e(w.agent)}</b> · ${app.STATE[w.state]} · ${e(w.branch)}${w.id === "orch" ? "" : ` · ${e(w.diff)} · Tests ${e(w.tests)}`}</p>
        ${entries}
        ${w.q ? `<section class="question" aria-label="Frage">
          <div class="who">${app.glyph("needs", 11)} ${e(w.agent)} fragt dich · ${e(w.since)}</div>
          <blockquote>${e(w.q.text)}</blockquote>
          <div class="opts">${w.q.options.map((o, i) => `<button class="btn ${i === 0 ? "go" : ""}" data-choice="${e(o)}" data-for="${w.id}" data-key="opt-${i}">${e(o)}</button>`).join("")}</div>
          <form data-answer="${w.id}"><label for="ans">Oder in eigenen Worten</label><textarea id="ans" data-key="ans" placeholder="Deine Antwort an ${e(w.agent)} …">${e(app.drafts[w.id] || "")}</textarea><button class="btn send" type="submit" data-key="send">Antwort senden</button></form>
        </section>` : ""}
      </article>`}
    </div>
  </main>
  <footer class="status" aria-label="Status">
    <span>${needs.length ? `<b style="color:var(--amber)">${needs.length} warten auf dich</b>` : "Niemand wartet auf dich"}</span>
    <span>${run.length} arbeiten · ${errs.length} Fehler</span>
    <span class="sp"></span>
    ${app.status.quota.map((q, i) => `<span class="${q.used >= 100 ? "out" : ""} ${i > 1 ? "opt" : ""}">${q.name} <b>${q.used >= 100 ? q.note : q.used + " %"}</b></span>`).join("")}
    <span>RAM frei <b>${app.status.ramFree} GB</b></span>
    <span>Warteschlange <b>${app.status.queue}</b></span>
    <span class="opt">cargo <b>${app.status.builds}</b></span>
  </footer>
</div>`;
      if (w.q) { const p = document.getElementById("panel"); const q = p.querySelector(".question"); if (q) p.scrollTop = Math.max(0, q.offsetTop - p.clientHeight + q.offsetHeight + 24); }
    },
  };
})();
</script>
</body>
