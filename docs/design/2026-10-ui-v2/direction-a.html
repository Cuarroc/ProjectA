      { name: "Codex", used: 100, note: "leer bis 11.10." },
      { name: "Kimi", used: 34, note: "Woche 34 %" },
      { name: "GLM", used: 18, note: "Woche 18 %" },
    ],
    ramFree: "6,2", ramTotal: "16", queue: 4, builds: "2/3", omni: true,
  };

  const app = {
    STATE, workers, orchestrator, status,
    tabs: ["orch", "w16-05", "w16-02", "w16-07"],
    tab: "w16-05",
    sel: "w16-05",
    drafts: {},
    byId(id) { return id === "orch" ? orchestrator : workers.find((w) => w.id === id); },
    current() { return app.byId(app.tab); },
    attention() { return workers.filter((w) => w.state === "needs").length; },
    count(s) { return workers.filter((w) => w.state === s).length; },
    esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    },
    termHTML(w) {
      const pre = { cmd: "›", agent: "●", you: "Du", ok: "", out: "", dim: "", err: "", warn: "" };
      return w.lines.map(([k, t]) =>
        `<div class="ln ln-${k}">${pre[k] ? `<span class="ln-pre" aria-hidden="true">${pre[k]}</span>` : ""}<span class="ln-t">${app.esc(t)}</span></div>`
      ).join("") + (w.live ? `<div class="ln ln-cursor"><span class="ln-pre" aria-hidden="true">›</span><span class="cursor" aria-hidden="true"></span></div>` : "");
    },
    // State glyphs: shape carries the state as well as colour (dot, diamond, cross, bars, ring).
    glyph(state, size) {
      const z = size || 12, a = `width="${z}" height="${z}" viewBox="0 0 12 12" aria-hidden="true" class="g g-${state}"`;
      if (state === "working") return `<svg ${a}><circle cx="6" cy="6" r="4" fill="currentColor"/></svg>`;
      if (state === "needs") return `<svg ${a}><path d="M6 1.2 10.8 6 6 10.8 1.2 6Z" fill="currentColor"/></svg>`;
      if (state === "error") return `<svg ${a}><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
      if (state === "merge") return `<svg ${a}><path d="M1.8 6.3 4.7 9.2 10.2 3.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      if (state === "review") return `<svg ${a}><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 2a4 4 0 0 1 0 8Z" fill="currentColor"/></svg>`;
      if (state === "paused") return `<svg ${a}><rect x="2.5" y="2" width="2.6" height="8" rx=".8" fill="currentColor"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8" fill="currentColor"/></svg>`;
      return `<svg ${a}><circle cx="6" cy="6" r="3.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    },
    select(id) {
      app.sel = id;
      if (!app.tabs.includes(id)) app.tabs.push(id);
      app.tab = id;
      app.render();
    },
    selectTab(id) { app.tab = id; app.sel = id; app.render(); },
    closeTab(id) {
      if (id === "orch") return;
      const i = app.tabs.indexOf(id);
      app.tabs.splice(i, 1);
      if (app.tab === id) { app.tab = app.tabs[Math.max(0, i - 1)]; app.sel = app.tab; }
      app.render();
    },
    answer(id, text) {
      const w = app.byId(id);
      if (!w || !w.q || !text.trim()) return;
      w.lines.push(L("you", text.trim()));
      w.lines.push(L("agent", "Understood. Continuing with: " + text.trim()));
      w.q = null; w.state = "working"; w.live = true; w.since = "gerade eben"; w.detail = "Arbeitet mit deiner Antwort weiter";
      delete app.drafts[id];
      app.announce(`Antwort an ${id} gesendet. ${w.title} arbeitet weiter.`);
      app.render();
    },
    announce(msg) { const el = document.getElementById("live"); if (el) el.textContent = msg; },
    render() {
      const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
      window.view.render(app);
      document.querySelectorAll("[data-scroll-end]").forEach((el) => { el.scrollTop = el.scrollHeight; });
      if (key) { const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (el) el.focus({ preventScroll: true }); }
    },
  };
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-select],[data-tab],[data-close],[data-choice],[data-theme-toggle]");
    if (!t) return;
    if (t.dataset.close) { e.stopPropagation(); app.closeTab(t.dataset.close); return; }
    if (t.dataset.select) app.select(t.dataset.select);
    else if (t.dataset.tab) app.selectTab(t.dataset.tab);
    else if (t.dataset.choice) app.answer(t.dataset.for, t.dataset.choice);
    else if (t.dataset.themeToggle !== undefined) {
      const r = document.documentElement;
      r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
      app.render();
    }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-answer]");
    if (!f) return;
    e.preventDefault();
    const input = f.querySelector("textarea,input");
    app.answer(f.dataset.answer, input.value);
  });
  document.addEventListener("input", (e) => {
    const f = e.target.closest("[data-answer]");
    if (f) app.drafts[f.dataset.answer] = e.target.value;
  });
  // Tablist keyboard: arrows, Home, End move and activate (WAI-ARIA tabs, automatic activation).
  document.addEventListener("keydown", (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    const list = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
    let i = list.indexOf(tab);
    if (e.key === "ArrowRight") i = (i + 1) % list.length;
    else if (e.key === "ArrowLeft") i = (i - 1 + list.length) % list.length;
    else if (e.key === "Home") i = 0;
    else if (e.key === "End") i = list.length - 1;
    else return;
    e.preventDefault();
    app.selectTab(list[i].dataset.tab);
  });
  // A url hash like #sel=w16-07 preselects a worker (used for the proof screenshots).
  const m = location.hash.match(/sel=([\w-]+)/);
  if (m && app.byId(m[1])) { app.sel = m[1]; if (!app.tabs.includes(m[1])) app.tabs.push(m[1]); app.tab = m[1]; }
  window.app = app;
  document.addEventListener("DOMContentLoaded", () => app.render());
})();
</script>
<script>
window.view = {
  render(app) {
    const e = app.esc, w = app.current();
    const seamVar = { working: "--steel", needs: "--amber", error: "--ember", paused: "--fog", idle: "--fog", merge: "--mint", review: "--violet" }[w.state];
    document.documentElement.style.setProperty("--seam", `var(${seamVar})`);
    const row = (x) => `<li><button class="row ${x.state}" data-select="${x.id}" data-key="row-${x.id}" aria-current="${x.id === app.sel}">
        ${app.glyph(x.state)}<span class="t">${e(x.title)}</span><span class="s">${e(x.since.replace("seit ", ""))}</span>
        <span class="m"><span class="sw">${app.STATE[x.state]}</span> · ${x.id} · ${e(x.agent)}</span></button></li>`;
    const order = { needs: 0, error: 1, working: 2, merge: 3, review: 4, paused: 5, idle: 6 };
    const sorted = [...app.workers].sort((a, b) => order[a.state] - order[b.state]);
    const att = app.attention();
    const tab = (id) => { const t = app.byId(id); return `<div role="presentation" class="tw${id === app.tab ? " on" : ""}"><button class="tab" role="tab" id="tab-${id}" data-tab="${id}" data-key="tab-${id}" aria-selected="${id === app.tab}" aria-controls="panel" tabindex="${id === app.tab ? 0 : -1}">${app.glyph(t.state, 10)}<span class="lbl">${id === "orch" ? "Orchestrator" : `${id} ${e(t.title)}`}</span></button>${id === "orch" ? "" : `<button class="x" aria-label="Tab ${id} schließen" data-close="${id}" tabindex="-1">×</button>`}</div>`; };
    const q = (s) => `<span class="q ${s.used >= 100 ? "out" : s.used >= 70 ? "hot" : ""}">${s.name} <i><b style="width:${s.used}%"></b></i> <span class="v">${s.used >= 100 ? s.note : s.used + " %"}</span></span>`;
    document.getElementById("root").innerHTML = `
<div class="win">
  <aside class="side" aria-label="Projekt und Worker">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><b>ProjectA</b><button class="proj" data-key="proj" aria-label="Projekt wechseln, aktuell ProjectA">ProjectA ▾</button></div>
    <ul class="list" style="flex:none;padding-top:8px" aria-label="Orchestrator">${`<li><button class="row working" data-select="orch" data-key="row-orch" aria-current="${app.sel === "orch"}">${app.glyph("working")}<span class="t">Orchestrator</span><span class="s"></span><span class="m"><span class="sw">Läuft</span> · verteilt ${app.status.queue} Aufträge · 2 Slots frei</span></button></li>`}</ul>
    <div class="group"><span>Worker · ${app.workers.length}</span>${att ? `<span class="need">${att} warten auf dich</span>` : ""}</div>
    <ul class="list" aria-label="Worker">${sorted.map(row).join("")}</ul>
    <div class="side-foot"><button class="btn primary" data-key="new">Neuer Worker</button></div>
  </aside>
  <main class="main">
    <div class="tabs" role="tablist" aria-label="Sitzungen">${app.tabs.map(tab).join("")}</div>
    <header class="head">
      <div><h1>${e(w.title)}</h1><div class="sub"><span class="state-word" style="color:var(${seamVar})">${app.STATE[w.state]}</span> · ${e(w.detail)} · <code>${e(w.branch)}</code></div></div>
      ${w.id === "orch" ? "" : `<div class="facts"><div class="fact"><span>Agent</span><b>${e(w.agent)}</b></div><div class="fact"><span>Laufzeit</span><b>${e(w.elapsed)}</b></div><div class="fact"><span>Diff</span><b>${e(w.diff)}</b></div><div class="fact"><span>Tests</span><b>${e(w.tests)}</b></div></div>`}
    </header>
    <div class="term" id="panel" role="tabpanel" aria-labelledby="tab-${w.id}" tabindex="0" data-scroll-end aria-label="Terminal ${e(w.title)}">${app.termHTML(w)}</div>
    ${w.q ? `<section class="dock" aria-label="Frage von ${w.id}">
      <div class="who">${app.glyph("needs", 10)} ${e(w.agent)} fragt · ${e(w.since)}</div>
      <p>${e(w.q.text)}</p>
      <div class="opts">${w.q.options.map((o, i) => `<button class="btn ${i === 0 ? "amber" : ""}" data-choice="${e(o)}" data-for="${w.id}" data-key="opt-${i}">${e(o)}</button>`).join("")}</div>
      <form data-answer="${w.id}"><label class="sr-only" for="ans">Eigene Antwort</label><textarea id="ans" data-key="ans" placeholder="Oder eigene Antwort schreiben …">${e(app.drafts[w.id] || "")}</textarea><button class="btn" type="submit" data-key="send">Antwort senden</button></form>
    </section>` : ""}
  </main>
  <footer class="status" aria-label="Status">
    <button class="att ${att ? "" : "none"}" data-select="${(app.workers.find((x) => x.state === "needs") || {}).id || "orch"}" data-key="att">${att ? `${app.glyph("needs", 10)} ${att} warten auf dich` : "Niemand wartet auf dich"}</button>
    <span>${app.count("working")} arbeiten · ${app.count("error")} Fehler · ${app.count("merge")} bereit zum Mergen</span>
    <span class="sp"></span>
    ${app.status.quota.map(q).join("")}
    <span class="hide-s">RAM <span class="v">${app.status.ramFree} GB</span> frei</span>
    <span>Warteschlange <span class="v">${app.status.queue}</span></span>
    <span class="hide-s">cargo <span class="v">${app.status.builds}</span></span>
    <span class="hide-s"><span class="dot" aria-hidden="true"></span> OmniRoute</span>
  </footer>
</div>`;
  },
};
</script>
</body>
</html>
