# LIC-01: license policy for the public repository.
# Checked by `cargo deny check licenses` (gate `licenses`, scripts/ci/license-check.sh).
# Anything not on this list is a finding for the orchestrator, not something a
# worker may silently add an exception for.

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "OFL-1.1",
]

# The workspace crate `projecta` itself carries no license field yet — the
# repo license is a LIC-01 "Needs decision" item. The gate's job here is the
# third-party tree, so unpublished workspace crates are skipped.
[licenses.private]
ignore = true

# Orchestrator decision 2026-09-25: CDLA-Permissive-2.0 (Linux Foundation
# permissive data license, not copyleft) is allowed ONLY for the crate
# webpki-root-certs (Mozilla root certificates, pulled in via
# rustls-platform-verifier <- reqwest <- tauri / tauri-plugin-updater).
# The global allowlist above stays unchanged; any other crate with a license
# outside it remains a finding, and the drift pin in
# scripts/lib/license-check.mjs flags any exception beyond this one.
# CDLA-Permissive-2.0 §2.1 requires shipping the license text with the data:
# the full text is in the "License texts" appendix of
# docs/THIRD_PARTY_NOTICES.md.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
